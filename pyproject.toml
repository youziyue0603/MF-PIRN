[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frank-wt-mf-pinn-final15"
version = "0.1.0"
description = "Source-locked structural transcription of the final Version 1.5 algorithm"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "torch>=2.2",
  "pymoo>=0.6",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "coverage>=7.0", "ruff>=0.15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

